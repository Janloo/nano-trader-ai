<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoTrader AI - HFT Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        
    </style>
</head>
<body>
    <nav>
        <div class="brand-container">
            <div class="brand-logo">N</div>
            <div class="brand-text">NanoTrader AI</div>
            <div class="nav-links">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/analytics" class="nav-link ">Analytics</a>
                <a href="/advanced-chart" class="nav-link ">Advanced Chart</a>
                <a href="/hft-chart" class="nav-link active">HFT Chart</a>
            </div>
        </div>
        <div class="nav-controls">
            <div class="status-badge">
                <div class="pulse-dot"></div>
                Live Engine Active
            </div>
        </div>
    </nav>
    <div class="dashboard-grid" style="display: block; padding: 20px; max-width: 1600px; margin: 0 auto;">
        
        <div class="panel" style="margin-bottom: 20px;">
            <div class="panel-header">
                <div class="panel-title">High-Frequency Execution Chart (HFT)</div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span id="loadingIndicator" style="color: var(--accent-blue); display: none;">Loading...</span>
                    <button id="refreshBtn" style="background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border); color: var(--text-main); padding: 5px 10px; border-radius: 6px; cursor: pointer;">Refresh</button>
                    <label style="color: var(--text-secondary); font-size: 0.9rem;"><input type="checkbox" id="autoRefresh" checked> Auto</label>
                </div>
            </div>
            <div style="height: 600px; width: 100%;">
                <canvas id="hftChart"></canvas>
            </div>
        </div>
        
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.3.0/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>
        <script>
const MECHS=[
  {id:'buy',    label:'BUY Eseguito',       color:'#10b981'},
  {id:'sell',   label:'SELL / Scale-Out',   color:'#06b6d4'},
  {id:'dip',    label:'DIP Rilevato',       color:'#f59e0b'},
  {id:'rsi',    label:'RSI Filter Block',   color:'#f97316'},
  {id:'trail',  label:'Trailing TP',        color:'#8b5cf6'},
  {id:'dca',    label:'Smart DCA',          color:'#ec4899'},
  {id:'l2',     label:'L2 Orderbook',       color:'#a78bfa'},
  {id:'mtf',    label:'MTF Filter',         color:'#3b82f6'},
  {id:'guard',  label:'Guardian',           color:'#ef4444'},
  {id:'div',    label:'RSI Divergence',     color:'#22c55e'},
];
let active=new Set(MECHS.map(m=>m.id));
let allData=null, chart=null, priceSeries=null;

function buildLegend(){
  const el=document.getElementById('legend');
  el.innerHTML='';
  MECHS.forEach(m=>{
    const p=document.createElement('div');
    p.className='legend-pill'+(active.has(m.id)?'':' inactive');
    p.id='pill-'+m.id;
    p.innerHTML=`<span class="dot" style="background:${m.color}"></span>${m.label}`;
    p.onclick=()=>{
      if(active.has(m.id))active.delete(m.id);else active.add(m.id);
      p.classList.toggle('inactive');
      renderMarkers();
    };
    el.appendChild(p);
  });
}

function parseLogTs(ts){
  try{return Math.floor(new Date(ts.replace(',','.').replace(' ','T')+'Z').getTime()/1000);}catch{return null;}
}
function parseIsoTs(ts){
  try{return Math.floor(new Date(ts).getTime()/1000);}catch{return null;}
}

async function loadData(){
  try{
    const r=await fetch('/api/hft-data');
    allData=await r.json();
    
    // Dynamically update sym-select
    if (allData.price_history) {
      const symbols = Object.keys(allData.price_history);
      const select = document.getElementById('sym-select');
      const currentVal = select.value;
      if (symbols.length > 0) {
        select.innerHTML = '';
        symbols.forEach(sym => {
          const opt = document.createElement('option');
          opt.value = sym;
          opt.textContent = sym;
          select.appendChild(opt);
        });
        if (symbols.includes(currentVal)) {
          select.value = currentVal;
        } else {
          select.value = symbols[0];
        }
      }
    }

    renderChart();
    updateStats();
    renderEvents();
  }catch(e){document.getElementById('no-data').textContent='Errore: '+e.message;}
}

function renderChart(){
  if(!allData)return;
  const sym=document.getElementById('sym-select').value;
  const zoom=parseInt(document.getElementById('zoom-range').value);

  const raw=(allData.price_history||{})[sym]||[];
  const prices=raw.slice(-zoom);

  const wrap=document.getElementById('chart');
  if(chart){chart.remove();chart=null;priceSeries=null;}

  chart=LightweightCharts.createChart(wrap,{
    layout:{background:{color:'#0a0e1a'},textColor:'#64748b'},
    grid:{vertLines:{color:'#1e2d45'},horzLines:{color:'#1e2d45'}},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    rightPriceScale:{borderColor:'#1e2d45'},
    timeScale:{borderColor:'#1e2d45',timeVisible:true,secondsVisible:false},
    width:wrap.clientWidth,height:480,
  });

  window.onresize=()=>{if(chart)chart.applyOptions({width:wrap.clientWidth});};

  priceSeries=chart.addLineSeries({color:'#3b82f6',lineWidth:2,priceLineVisible:false,lastValueVisible:true});
  const lineData=prices.map(p=>({time:parseIsoTs(p.timestamp),value:parseFloat(p.price)})).filter(d=>d.time&&!isNaN(d.value));
  if(lineData.length)priceSeries.setData(lineData);

  renderMarkers();
  setupTooltip();
}

function renderMarkers(){
  if(!priceSeries||!allData)return;
  const sym=document.getElementById('sym-select').value;
  const zoom=parseInt(document.getElementById('zoom-range').value);
  const raw=(allData.price_history||{})[sym]||[];
  const prices=raw.slice(-zoom);
  const minTs=prices.length?parseIsoTs(prices[0].timestamp):0;

  const markers=[];
  const sym3=sym.replace('USD','');

  (allData.trades||[]).filter(t=>t.symbol===sym&&parseIsoTs(t.timestamp)>=minTs).forEach(t=>{
    const ts=parseIsoTs(t.timestamp);if(!ts)return;
    if(t.action==='BUY'&&active.has('buy'))
      markers.push({time:ts,position:'belowBar',color:'#10b981',shape:'arrowUp',text:'BUY $'+Number(t.notional||0).toFixed(0),size:2});
    else if(t.action==='SELL'&&active.has('sell'))
      markers.push({time:ts,position:'aboveBar',color:'#06b6d4',shape:'arrowDown',text:'SELL',size:2});
  });

  (allData.log_events||[]).filter(e=>{
    const ts=parseLogTs(e.timestamp);
    return ts&&ts>=minTs;
  }).forEach(e=>{
    const ts=parseLogTs(e.timestamp);
    const msg=e.message;
    if(active.has('dip')&&msg.includes('[WS DIP]')&&msg.includes(sym3))
      markers.push({time:ts,position:'belowBar',color:'#f59e0b',shape:'circle',text:'DIP',size:1});
    if(active.has('rsi')&&msg.includes('[WS FILTER]')&&msg.includes(sym3))
      markers.push({time:ts,position:'belowBar',color:'#f97316',shape:'circle',text:'RSI✗',size:1});
    if(active.has('trail')&&msg.includes('trailing activated')&&msg.includes(sym))
      markers.push({time:ts,position:'aboveBar',color:'#8b5cf6',shape:'circle',text:'▲TRAIL',size:1});
    if(active.has('trail')&&msg.includes('hit trail trigger')&&msg.includes(sym))
      markers.push({time:ts,position:'aboveBar',color:'#06b6d4',shape:'circle',text:'⊗HIT',size:2});
    if(active.has('dca')&&msg.includes('Smart DCA')&&msg.includes(sym))
      markers.push({time:ts,position:'belowBar',color:'#ec4899',shape:'circle',text:'DCA',size:1});
    if(active.has('l2')&&msg.includes('Bullish Wall')&&msg.includes(sym3))
      markers.push({time:ts,position:'belowBar',color:'#a78bfa',shape:'circle',text:'L2x2',size:1});
    if(active.has('mtf')&&msg.includes('[MTF FILTER]')&&msg.includes(sym))
      markers.push({time:ts,position:'aboveBar',color:'#3b82f6',shape:'circle',text:'MTF',size:1});
    if(active.has('guard')&&msg.includes('[GUARDIAN]')&&msg.includes(sym3))
      markers.push({time:ts,position:'aboveBar',color:'#ef4444',shape:'circle',text:'GUARD',size:2});
    if(active.has('div')&&msg.includes('[WS DIVERGENCE]')&&msg.includes(sym))
      markers.push({time:ts,position:'belowBar',color:'#22c55e',shape:'arrowUp',text:'DIV',size:2});
  });

  markers.sort((a,b)=>a.time-b.time);
  priceSeries.setMarkers(markers);
}

function updateStats(){
  if(!allData)return;
  const sym=document.getElementById('sym-select').value;
  const sym3=sym.replace('USD','');
  const ev=allData.log_events||[];
  const tr=allData.trades||[];
  document.getElementById('s-buys').textContent=tr.filter(t=>t.symbol===sym&&t.action==='BUY').length;
  document.getElementById('s-trails').textContent=ev.filter(e=>e.message.includes('hit trail trigger')&&e.message.includes(sym)).length;
  document.getElementById('s-rsi').textContent=ev.filter(e=>e.message.includes('[WS FILTER]')&&e.message.includes(sym3)).length;
  document.getElementById('s-l2').textContent=ev.filter(e=>e.message.includes('Bullish Wall')&&e.message.includes(sym3)).length;
  document.getElementById('s-mtf').textContent=ev.filter(e=>e.message.includes('[MTF FILTER]')&&e.message.includes(sym)).length;
  document.getElementById('s-dca').textContent=ev.filter(e=>e.message.includes('Smart DCA')&&e.message.includes(sym)).length;
}

const TAG_META={
  '[WS TRIGGER]':   {label:'BUY',   bg:'rgba(16,185,129,.2)', color:'#10b981'},
  '[WS FILTER]':    {label:'RSI✗',  bg:'rgba(249,115,22,.2)', color:'#f97316'},
  '[TRAILING TP]':  {label:'TRAIL', bg:'rgba(6,182,212,.2)',  color:'#06b6d4'},
  '[WS L2]':        {label:'L2',    bg:'rgba(139,92,246,.2)', color:'#8b5cf6'},
  '[MTF FILTER]':   {label:'MTF',   bg:'rgba(59,130,246,.2)', color:'#3b82f6'},
  '[MTF]':          {label:'MTF',   bg:'rgba(59,130,246,.1)', color:'#3b82f6'},
  '[WS DIP]':       {label:'DIP',   bg:'rgba(245,158,11,.2)', color:'#f59e0b'},
  '[WS LEAD-LAG]':  {label:'LEAD',  bg:'rgba(236,72,153,.2)', color:'#ec4899'},
  '[GUARDIAN]':     {label:'GUARD', bg:'rgba(239,68,68,.2)',  color:'#ef4444'},
  '[WS DIVERGENCE]':{label:'DIV',   bg:'rgba(34,197,94,.2)',  color:'#22c55e'},
  '[WS] Smart DCA': {label:'DCA',   bg:'rgba(236,72,153,.15)',color:'#ec4899'},
  '[WS DRY-RUN]':   {label:'DRY',   bg:'rgba(100,116,139,.2)',color:'#94a3b8'},
  '[KELLY ADAPTIVE]':{label:'KELLY',bg:'rgba(16,185,129,.15)',color:'#10b981'},
};

function renderEvents(){
  if(!allData)return;
  const feed=document.getElementById('events-feed');
  feed.innerHTML='';
  const evs=[...(allData.log_events||[])].reverse().slice(0,300);
  if(!evs.length){feed.innerHTML='<div id="no-data">Nessun evento nei log.</div>';return;}
  evs.forEach(e=>{
    const meta=TAG_META[e.tag]||{label:e.tag,bg:'transparent',color:'#64748b'};
    const row=document.createElement('div');row.className='event-row';
    row.innerHTML=`<span class="et">${e.timestamp.replace(/,\d+$/,'')}</span><span class="etag" style="background:${meta.bg};color:${meta.color}">${meta.label}</span><span class="emsg">${e.message.replace(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d+ \[INFO\] nano-trader-ai: /,'')}</span>`;
    feed.appendChild(row);
  });
}

function setupTooltip(){
  if(!chart||!priceSeries)return;
  const tt=document.getElementById('tooltip');
  const wrap=document.getElementById('chart-wrap');
  chart.subscribeCrosshairMove(param=>{
    if(!param||!param.time){tt.style.display='none';return;}
    const price=param.seriesData.get(priceSeries);
    if(!price){tt.style.display='none';return;}
    const sym=document.getElementById('sym-select').value;
    const d=new Date(param.time*1000);
    const timeStr=d.toISOString().replace('T',' ').slice(0,19)+' UTC';
    const evts=(allData?.log_events||[]).filter(e=>{
      const ts=parseLogTs(e.timestamp);
      return ts&&Math.abs(ts-param.time)<90&&e.message.includes(sym.replace('USD',''));
    }).slice(0,5);
    let evtHtml=evts.map(e=>{
      const meta=TAG_META[e.tag]||{color:'#64748b'};
      return `<div class="tt-event"><span class="dot" style="background:${meta.color}"></span><span>${e.message.replace(/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d+ \[INFO\] nano-trader-ai: /,'').slice(0,100)}</span></div>`;
    }).join('');
    if(!evtHtml)evtHtml='<div style="color:var(--muted);font-size:11px">Nessun meccanismo in questo momento</div>';
    tt.innerHTML=`<div class="tt-time">${timeStr}</div><div class="tt-price">${Number(price.value).toLocaleString('en-US',{minimumFractionDigits:4,maximumFractionDigits:6})}</div>${evtHtml}`;
    tt.style.display='block';
    const x=param.point.x,y=param.point.y;
    const rect=wrap.getBoundingClientRect();
    const ttW=tt.offsetWidth;
    let left=x+16;if(left+ttW>rect.width-20)left=x-ttW-16;
    tt.style.left=left+'px';tt.style.top=Math.max(0,y-40)+'px';
  });
}

function onSymChange(){renderChart();updateStats();}
function onZoom(){
  document.getElementById('zoom-val').textContent=document.getElementById('zoom-range').value;
  renderChart();
}

document.addEventListener('DOMContentLoaded',()=>{
  buildLegend();
  loadData();
  setInterval(()=>loadData(),60000);
});
</script>
</body>
</html>
