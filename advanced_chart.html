<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoTrader AI - Advanced Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        
    </style>
</head>
<body>
    <nav>
        <div class="brand-container">
            <div class="brand-logo">N</div>
            <div class="brand-text">NanoTrader AI</div>
            <div class="nav-links">
                <a href="/" class="nav-link">Dashboard</a>
                <a href="/analytics" class="nav-link ">Analytics</a>
                <a href="/advanced-chart" class="nav-link active">Advanced Chart</a>
                <a href="/hft-chart" class="nav-link ">HFT Chart</a>
            </div>
        </div>
        <div class="nav-controls">
            <div class="status-badge">
                <div class="pulse-dot"></div>
                Live Engine Active
            </div>
        </div>
    </nav>
    <div class="dashboard-grid" style="display: block; padding: 20px; max-width: 1600px; margin: 0 auto;">
        
        <div class="panel" style="margin-bottom: 20px;">
            <div class="panel-header">
                <div class="panel-title">Advanced Price & Technicals</div>
                <div>
                    <select id="timeRange" onchange="fetchChartData()" style="background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border); color: var(--text-main); padding: 5px 10px; border-radius: 6px;">
                        <option value="1h">1 Hour</option>
                        <option value="4h">4 Hours</option>
                        <option value="12h">12 Hours</option>
                        <option value="24h" selected>24 Hours</option>
                        <option value="7d">7 Days</option>
                    </select>
                </div>
            </div>
            <div style="height: 600px; width: 100%;">
                <canvas id="advancedChart"></canvas>
            </div>
        </div>
        
    </div>
    
</body>
</html>
