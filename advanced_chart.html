<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoTrader AI - Advanced Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment@1.0.1/dist/chartjs-adapter-moment.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="h-full bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
    <nav class="border-b border-slate-800/80 bg-slate-950/60 backdrop-blur-md sticky top-0 z-40">
        <div class="w-full px-4 sm:px-6 lg:px-8">
            <div class="flex h-16 items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center">
                        <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                        </svg>
                    </div>
                    <span class="text-lg font-bold bg-gradient-to-r from-blue-400 to-indigo-200 bg-clip-text text-transparent">Advanced Chart</span>
                    <!-- Premium Tab Links -->
                    <div class="hidden md:flex items-center p-1 bg-slate-900/80 border border-slate-700/50 rounded-2xl shadow-inner ml-8">
                        <a href="/" class="flex items-center gap-2 text-sm font-bold px-4 py-2 transition-all rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/60">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                            Dashboard
                        </a>
                        <a href="/advanced-chart" class="flex items-center gap-2 text-sm font-bold px-4 py-2 transition-all rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-md shadow-blue-500/20">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z"></path></svg>
                            Adv. Chart
                        </a>
                        <a href="/analytics" class="flex items-center gap-2 text-sm font-bold px-4 py-2 transition-all rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/60">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                            Analytics
                        </a>
                        <a href="/hft-chart" class="flex items-center gap-2 text-sm font-bold px-4 py-2 transition-all rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/60">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            HFT Mechanisms
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="w-full px-4 py-8 sm:px-6 lg:px-8">
        <div class="mb-4 flex flex-wrap gap-2 items-center justify-between">
            <h1 class="text-2xl font-bold text-white">Portfolio Composition & Trend</h1>
            <div class="flex gap-2 bg-slate-900/50 p-1 rounded-lg border border-slate-800" id="time-filters">
                <button data-period="1H" class="px-3 py-1 text-sm font-medium rounded-md text-slate-400 hover:text-white hover:bg-slate-800 filter-btn">1H</button>
                <button data-period="1D" class="px-3 py-1 text-sm font-medium rounded-md text-slate-400 hover:text-white hover:bg-slate-800 filter-btn bg-slate-800 text-white active">1D</button>
                <button data-period="1W" class="px-3 py-1 text-sm font-medium rounded-md text-slate-400 hover:text-white hover:bg-slate-800 filter-btn">1W</button>
                <button data-period="1M" class="px-3 py-1 text-sm font-medium rounded-md text-slate-400 hover:text-white hover:bg-slate-800 filter-btn">1M</button>
                <button data-period="ALL" class="px-3 py-1 text-sm font-medium rounded-md text-slate-400 hover:text-white hover:bg-slate-800 filter-btn">ALL</button>
            </div>
        </div>
        
        <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 md:p-6 backdrop-blur-md shadow-2xl relative" style="height: 600px;">
            <canvas id="advancedChart"></canvas>
        </div>
    </main>

    <script>
        let rawData = [];
        let chartInstance = null;
        let currentPeriod = '1D';

        async function loadData() {
            try {
                const res = await fetch('/api/portfolio-advanced');
                rawData = await res.json();
                updateChart();
            } catch (e) {
                console.error("Error loading data", e);
            }
        }

        function filterData(data, periodStr) {
            if (periodStr === 'ALL') return data;
            const now = new Date();
            let msToSub = 0;
            if (periodStr === '1H') msToSub = 3600000;
            if (periodStr === '1D') msToSub = 86400000;
            if (periodStr === '1W') msToSub = 7 * 86400000;
            if (periodStr === '1M') msToSub = 30 * 86400000;
            
            const threshold = now.getTime() - msToSub;
            return data.filter(d => new Date(d.timestamp).getTime() >= threshold);
        }

        function calculateLinearRegression(data, yKey) {
            const n = data.length;
            if (n < 2) return [];
            let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
            const startX = new Date(data[0].timestamp).getTime();
            
            const points = data.map((d, i) => {
                const x = (new Date(d.timestamp).getTime() - startX) / 1000; // in seconds to avoid huge numbers
                const y = d[yKey];
                sumX += x;
                sumY += y;
                sumXY += (x * y);
                sumXX += (x * x);
                return {x, y, rawX: d.timestamp};
            });

            // Prevent division by zero if all x are the same
            if ((n * sumXX - sumX * sumX) === 0) return points.map(p => ({x: p.rawX, y: p.y}));

            const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;

            return points.map(p => ({
                x: p.rawX,
                y: slope * p.x + intercept
            }));
        }

        function updateChart() {
            const filtered = filterData(rawData, currentPeriod);
            if (!filtered.length) return;

            const labels = filtered.map(d => d.timestamp);
            const eqData = filtered.map(d => d.equity);
            const crData = filtered.map(d => d.crypto_equity || 0);
            const stData = filtered.map(d => d.stock_equity || 0);
            
            const trendData = calculateLinearRegression(filtered, 'equity');

            if (chartInstance) {
                chartInstance.destroy();
            }

            const ctx = document.getElementById('advancedChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Total Equity Trend',
                            data: trendData.map(d => d.y),
                            borderColor: 'rgba(16, 185, 129, 0.8)',
                            borderDash: [5, 5],
                            borderWidth: 2,
                            fill: false,
                            pointRadius: 0,
                            tension: 0
                        },
                        {
                            label: 'Total Equity',
                            data: eqData,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            pointRadius: 0,
                            tension: 0.1
                        },
                        {
                            label: 'Crypto Allocation',
                            data: crData,
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.15)',
                            borderWidth: 2,
                            fill: true,
                            pointRadius: 0,
                            tension: 0.2
                        },
                        {
                            label: 'Stock Allocation',
                            data: stData,
                            borderColor: '#8b5cf6',
                            backgroundColor: 'rgba(139, 92, 246, 0.15)',
                            borderWidth: 2,
                            fill: true,
                            pointRadius: 0,
                            tension: 0.2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: { tooltipFormat: 'll HH:mm' },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { color: 'rgba(148, 163, 184, 0.8)' }
                        },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' },
                            ticks: { 
                                color: 'rgba(148, 163, 184, 0.8)',
                                callback: function(val) { return '$' + val.toLocaleString(); }
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#fff',
                            bodyColor: '#cbd5e1',
                            borderColor: '#334155',
                            borderWidth: 1,
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': $' + context.parsed.y.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
                                }
                            }
                        },
                        legend: {
                            labels: { color: 'rgba(148, 163, 184, 0.9)', font: { family: 'Outfit', weight: '500' } }
                        }
                    }
                }
            });
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('bg-slate-800', 'text-white', 'active');
                });
                e.target.classList.add('bg-slate-800', 'text-white', 'active');
                currentPeriod = e.target.getAttribute('data-period');
                updateChart();
            });
        });

        loadData();
        setInterval(loadData, 30000); // refresh every 30s
    </script>
</body>
</html>
