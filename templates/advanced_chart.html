{% extends 'base.html' %}

{% set active_page = 'advanced_chart' %}

{% block title %}NanoTrader AI - Advanced Chart{% endblock %}

{% block content %}
<div class="dashboard-grid" style="display: block; padding: 20px; max-width: 1600px; margin: 0 auto;">
        
        <div class="panel" style="margin-bottom: 20px;">
            <div class="panel-header">
                <div class="panel-title">Advanced Price & Technicals</div>
                <div>
                    <select id="timeRange" onchange="fetchChartData()" style="background: rgba(255,255,255,0.05); border: 1px solid var(--panel-border); color: var(--text-main); padding: 5px 10px; border-radius: 6px;">
                        <option value="1h">1 Hour</option>
                        <option value="4h">4 Hours</option>
                        <option value="12h">12 Hours</option>
                        <option value="24h" selected>24 Hours</option>
                        <option value="7d">7 Days</option>
                    </select>
                </div>
            </div>
            <div style="height: 600px; width: 100%;">
                <canvas id="advancedChart"></canvas>
            </div>
        </div>
        
    </div>
{% endblock %}

{% block extra_scripts %}
<script>
    let advChart = null;
    
    async function fetchChartData() {
        const timeRange = document.getElementById('timeRange').value;
        try {
            const response = await fetch(`/api/portfolio-advanced?range=${timeRange}`);
            if (response.ok) {
                const data = await response.json();
                
                const labels = data.map(d => {
                    const parts = d.timestamp.split('T');
                    return parts.length > 1 ? parts[1].substring(0, 5) : d.timestamp;
                });
                const equityData = data.map(d => d.equity);
                
                const ctx = document.getElementById('advancedChart').getContext('2d');
                if (advChart) advChart.destroy();
                
                advChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Portfolio Equity',
                            data: equityData,
                            borderColor: '#3b82f6',
                            borderWidth: 2,
                            fill: false,
                            tension: 0.1,
                            pointRadius: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } },
                            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8' } }
                        },
                        plugins: {
                            legend: { labels: { color: '#f8fafc' } }
                        }
                    }
                });
            }
        } catch(e) {
            console.error("Error loading advanced chart data", e);
        }
    }
    
    // Auto load on init
    fetchChartData();
</script>
{% endblock %}
